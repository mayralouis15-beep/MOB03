<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 - Cardápio Dinâmico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .info-box {
            background: white;
            border-left: 4px solid #fa709a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            color: #333;
        }
        
        .info-box strong {
            color: #fa709a;
        }
        
        .cardapio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .card-produto {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card-produto:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }
        
        .card-imagem {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            padding: 40px 20px;
            text-align: center;
            font-size: 70px;
        }
        
        .card-conteudo {
            padding: 20px;
        }
        
        .card-id {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        
        .card-nome {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .card-preco {
            color: #fa709a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .card-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .card-btn:hover {
            transform: scale(1.05);
        }
        
        .card-btn:active {
            transform: scale(0.98);
        }
        
        .total-produtos {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #666;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Gerador Automático de Cardápio</h1>
        <p class="subtitle">Transformando dados em HTML com .map()</p>
        
        <div class="info-box">
            <strong>💡 Conceito:</strong> A função <code>.map()</code> percorre cada objeto do array e o transforma 
            em um bloco de HTML pronto para ser exibido na tela, sem necessidade de escrever HTML repetitivo.
        </div>
        
        <div class="cardapio-grid" id="cardapio"></div>
        
        <div class="total-produtos" id="total"></div>
    </div>

    <script>
        // Array de produtos do cardápio
        const produtos = [
            { id: 1, nome: "Hamburger Clássico", preco: 35.00, img: "🍔" },
            { id: 2, nome: "Pizza Margherita", preco: 42.00, img: "🍕" },
            { id: 3, nome: "Refrigerante Gelado", preco: 8.50, img: "🥤" },
            { id: 4, nome: "Sorvete de Chocolate", preco: 12.00, img: "🍨" }  // MISSÃO: Produto adicionado
        ];

        // Função para adicionar ao carrinho
        function adicionarAoCarrinho(nomeProduto) {
            alert(`✅ ${nomeProduto} adicionado ao carrinho!`);
        }

        // Usa .map() para transformar cada produto em HTML
        const cardapioHTML = produtos
            .map(produto => `
                <div class="card-produto">
                    <div class="card-imagem">${produto.img}</div>
                    <div class="card-conteudo">
                        <div class="card-id">ID: ${produto.id}</div>
                        <div class="card-nome">${produto.nome}</div>
                        <div class="card-preco">R$ ${produto.preco.toFixed(2)}</div>
                        <button class="card-btn" onclick="adicionarAoCarrinho('${produto.nome}')">
                            🛒 Comprar
                        </button>
                    </div>
                </div>
            `)
            .join('');  // Junta todos os cards em uma única string

        // Exibe os produtos na tela
        document.getElementById('cardapio').innerHTML = cardapioHTML;
        
        // Exibe total de produtos
        document.getElementById('total').textContent = 
            `📦 Total de produtos no cardápio: ${produtos.length}`;
    </script>
</body>
</html>
